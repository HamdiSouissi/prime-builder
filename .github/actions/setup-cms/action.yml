name: Set up Prime CMS
inputs:
  copy-plugin:
    description: Copy the plugin checkout into the CMS
    default: 'true'
  install-dependencies:
    description: Install CMS development dependencies
    default: 'false'
  cms-ref:
    description: CMS commit to test, or main
    default: 'main'
runs:
  using: composite
  steps:
    - uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: mbstring, gd, exif, pdo_mysql, pdo_sqlite, zip, fileinfo, openssl, intl
        coverage: none
    - name: Clone Prime CMS
      shell: bash
      env:
        CMS_REF: ${{ inputs.cms-ref }}
      run: |
        set -o pipefail
        clone_cms() {
          git clone --depth 1 --branch main https://github.com/HamdiSouissi/prime-cms.git cms || return
          if [[ "$CMS_REF" != main ]]; then
            git -C cms fetch --depth 1 origin "$CMS_REF" || return
            git -C cms checkout --detach FETCH_HEAD || return
          fi
          git -C cms rev-parse HEAD
        }
        log="$RUNNER_TEMP/prime-builder-cms-clone.log"
        clone_cms 2>&1 | tee "$log" || {
          status=$?
          echo "::error title=CMS clone log (base64)::$(tail -80 "$log" | base64 -w0)"
          exit "$status"
        }
    - name: Copy plugin
      if: inputs.copy-plugin == 'true'
      shell: bash
      run: |
        mkdir -p cms/content/plugins/prime-builder
        rsync -a --exclude='.git' builder/ cms/content/plugins/prime-builder/
    - name: Install CMS development dependencies
      if: inputs.install-dependencies == 'true'
      shell: bash
      working-directory: cms
      run: composer install --no-interaction --prefer-dist --no-progress
