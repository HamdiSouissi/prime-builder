name: Temporary model form trace diagnostic
on:
  push:

jobs:
  trace:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: prime-builder-e2e-results
          run-id: 46077033490
          github-token: ${{ github.token }}
          path: evidence
      - name: Report model form trace timings
        run: |
          python3 - <<'PY' > /tmp/model-form-summary
          from pathlib import Path
          from zipfile import ZipFile
          import json

          paths = list(Path('evidence').rglob('model-forms*/trace.zip'))
          if len(paths) != 1:
              raise SystemExit(f'Expected one model form trace, found: {paths}')
          with ZipFile(paths[0]) as archive:
              events = [json.loads(line) for line in archive.read('test.trace').splitlines()]
              before = [event for event in events if event.get('type') == 'before' and event.get('method') in ('pw:api', 'expect') and any('model-forms.spec.mjs' in frame.get('file', '') for frame in event.get('stack', []))]
              after = {event['callId']: event for event in events if event.get('type') == 'after' and 'callId' in event}
              end = max((event.get('endTime', event.get('startTime', 0)) for event in events), default=0)
              longest = []
              for event in before:
                  result = after.get(event['callId'], {})
                  duration = result.get('endTime', end) - event['startTime']
                  if duration >= 10000:
                      longest.append(event)
              print('Model form long operations and last 35 traced calls:')
              selected = {event['callId'] for event in longest + before[-35:]}
              for event in before:
                  if event['callId'] not in selected:
                      continue
                  result = after.get(event['callId'], {})
                  duration = result.get('endTime', end) - event['startTime']
                  frame = next(frame for frame in event['stack'] if 'model-forms.spec.mjs' in frame.get('file', ''))
                  title = event.get('title', '')
                  if title.startswith('{') or len(title) > 100:
                      title = event.get('method', '')
                  print(f"{event['callId']} line={frame.get('line')} duration={duration/1000:.2f}s title={title} error={bool(result.get('error'))}")
              for event in longest:
                  step = event['callId']
                  for name in archive.namelist():
                      if not name.endswith('-trace.trace'):
                          continue
                      library = [json.loads(line) for line in archive.read(name).splitlines()]
                      calls = [row for row in library if row.get('type') == 'before' and row.get('stepId') == step]
                      for call in calls:
                          params = call.get('params', {})
                          print(f"\nLong call {step}: {call.get('class')}.{call.get('method')} selector={params.get('selector', '')}")
                          messages = [row.get('message', '') for row in library if row.get('type') == 'log' and row.get('callId') == call.get('callId')]
                          for message in messages[-12:]:
                              print(message[:220])
          PY
          split -b 2700 /tmp/model-form-summary /tmp/model-form-summary-
          for part in /tmp/model-form-summary-??; do
            echo "::notice title=Model form trace $(basename "$part") (base64)::$(base64 -w0 "$part")"
          done
